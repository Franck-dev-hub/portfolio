<nav
  [attr.aria-label]="t().sidebar.label"
  [class.active]="sidebar.isOpen()"
  class="side-menu"
  id="side-menu"
>
  <ul class="nav-links">
    @for (link of externalLinks; track link.key) {
      <li>
        <a
          (click)="sidebar.close()"
          [href]="link.href"
          [title]="t().sidebar[link.key]"
          class="menu-btn"
          rel="noopener noreferrer"
          target="_blank"
        >
          <lucide-icon [img]="link.icon" />
          <span class="link-text">{{ t().sidebar[link.key] }}</span>
        </a>
      </li>
    }

    <li aria-hidden="true" class="separator"></li>

    @for (link of sectionLinks; track link.key) {
      <li>
        <a
          (click)="sidebar.close()"
          [href]="link.href"
          [title]="t().sidebar[link.key]"
          class="menu-btn"
        >
          <lucide-icon [img]="link.icon" />
          <span class="link-text">{{ t().sidebar[link.key] }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
